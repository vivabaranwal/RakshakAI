# Render blueprint: backend API + static frontend + Postgres.
# Deploy via render.com -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: rakshak-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set this in the Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://rakshak-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: rakshak-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: rakshak-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: rakshak-ai
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rakshak-api.onrender.com
    routes:
      # SPA fallback so refreshing /public or /govt doesn't 404.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: rakshak-db
    plan: free
